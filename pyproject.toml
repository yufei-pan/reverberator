[project]
name = "reverberator"
version = "0.55.5"
description = "A inotify based tool to create REVERBs (REcursive VERsioning Backup) using symlinks"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
authors = [
    { name = "Yufei Pan", email = "pan@zopyr.us" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "inotify-simple>=1.3.5",
    "multicmd>=1.51",
    "pathspec>=0.12.1",
    "tee-logger>=6.44",
    "tsvz>=3.39",
    "xxhash>=3.5.0",
]

[project.scripts]
reverberator = "reverberator:main"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-xdist>=3"]

[tool.pytest.ini_options]
testpaths = ["tests", "reverberator.py"]
addopts = ["--doctest-modules", "-ra"]
# an xdist worker has threads of its own, and the crash tests fork from it: the child only runs a batch and is killed
filterwarnings = ["ignore:This process .* is multi-threaded, use of fork:DeprecationWarning"]
norecursedirs = [".venv", "dist", ".git"]
pythonpath = ["."]
markers = [
	"unit: in-process; may spawn helper commands such as cp, never the daemon or its CLI; may need root for a trusted.* attribute or a chown",
	"inotify: a real inotify watch (an instance made by the watcher, or by the test)",
	"process: spawns the daemon or its CLI (reverberator.py) as a process",
	"privileged: mounts a filesystem (a loop image, tmpfs, mergerfs, dm)",
]
