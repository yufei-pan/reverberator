[project]
name = "reverberator"
version = "0.26"
description = "A inotify based tool to create REVERBs (REcursive VERsioning Backup) using symlinks"
readme = "README.md"
requires-python = ">=3.7"
license = "GPL-3.0-or-later"
authors = [
    { name = "Yufei Pan", email = "pan@zopyr.us" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "inotify-simple>=1.3.5",
    "multicmd>=1.29",
    "tee-logger>=6.34",
    "tsvz>=3.25",
    "xxhash>=3.5.0",
]

[project.scripts]
reverberator = "reverberator:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests", "reverberator.py"]
addopts = ["--doctest-modules", "-ra"]
norecursedirs = [".venv", "dist", ".git"]
pythonpath = ["."]
markers = [
	"unit: fast in-process tests",
	"inotify: live kernel inotify",
	"process: spawn reverberator CLI",
	"privileged: requires root or REVERB_PRIVILEGED=1",
]
